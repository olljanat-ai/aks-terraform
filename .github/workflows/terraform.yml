name: Terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the lower bound of required_version in terraform.tf.
  TERRAFORM_VERSION: "1.14.4"
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: Format, validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # No backend and no credentials: this only has to resolve the providers and the module.
      - name: Initialize
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      # The providers are mocked in the suite, so this reaches no Azure subscription.
      - name: Test
        run: terraform test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installed from the pinned release rather than through an action, so that the version in the
      # workflow is the version that runs.
      - name: Install tflint
        env:
          TFLINT_VERSION: v0.60.0
        run: |
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/tflint.zip" \
            "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip"
          unzip -o "${RUNNER_TEMP}/tflint.zip" -d "${RUNNER_TEMP}/tflint"
          echo "${RUNNER_TEMP}/tflint" >> "${GITHUB_PATH}"

      - name: Install the rulesets pinned in .tflint.hcl
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint
        run: tflint --format=compact

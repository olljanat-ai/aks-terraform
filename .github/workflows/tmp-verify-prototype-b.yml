name: Verify prototype-b (temporary)

# Temporary: once the rebuilt aks-prototype-b is up, deletes AKS's two StorageClasses (the platform's
# no-persistent-storage policy then refuses their re-creation), checks that Flux is in sync and the
# test application answers without boot-log, and an hour later that no StorageClass has come back.
# Remove before merging.
on:
  pull_request:
    paths:
      - .github/workflows/tmp-verify-prototype-b.yml

permissions:
  contents: read

# A group of its own: a newer run must not cancel the one-hour StorageClass check already running.
concurrency:
  group: tmp-verify-prototype-b-2
  cancel-in-progress: true

jobs:
  flux:
    runs-on: ubuntu-latest
    environment: prototype
    timeout-minutes: 180
    env:
      RESOURCE_GROUP: rg-aks-prototype
      CLUSTER: aks-prototype-b
      AAD_SERVICE_PRINCIPAL_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AAD_SERVICE_PRINCIPAL_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - name: Sign in to Azure
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          sudo az aks install-cli --only-show-errors >/dev/null

      # The cluster may still be (re)building: wait for its credentials and the platform's
      # no-persistent-storage policy, which Flux applies.
      - name: Wait for the cluster and its policy
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          for i in $(seq 1 75); do
            echo "== $(date -u +%T)"
            if az aks get-credentials -g "$RESOURCE_GROUP" -n "$CLUSTER" --file "$KUBECONFIG" --overwrite-existing --only-show-errors \
              && kubelogin convert-kubeconfig -l spn --client-id "$AAD_SERVICE_PRINCIPAL_CLIENT_ID" --client-secret "$AAD_SERVICE_PRINCIPAL_CLIENT_SECRET" --tenant-id "$AZURE_TENANT_ID" --server-id 6dae42f8-4368-4678-94ff-3960e28e3630 \
              && kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A \
              && kubectl get validatingadmissionpolicy no-persistent-storage; then
              exit 0
            fi
            sleep 60
          done
          echo "::error::The cluster or its no-persistent-storage policy did not come up within 75 minutes."
          exit 1

      - name: Flux in sync, aks-hello up, no boot-log
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          set -x
          kubectl get gitrepositories.source.toolkit.fluxcd.io,kustomizations.kustomize.toolkit.fluxcd.io -n example -o yaml
          kubectl get externalsecrets.external-secrets.io,secretstores.external-secrets.io,secrets -n example
          kubectl get externalsecrets.external-secrets.io -n example -o jsonpath='{range .items[*]}{.metadata.name}: {.status.conditions}{"\n"}{end}'
          kubectl describe externalsecrets.external-secrets.io -n example | tail -n 40
          kubectl get events -n example --sort-by=.lastTimestamp | tail -n 20
          kubectl get secretstore -n example key-vault -o yaml | tail -n 20
          for name in example--aks-fluxcd-example-git example--ghcr-pull ingress-gateway--wildcard flux-system--github-webhook-token; do
            echo "== $name: $(az keyvault secret show --vault-name kv-sec-prototype-shared --name "$name" --query '{id: id, enabled: attributes.enabled}' -o json 2>&1 | tr '\n' ' ')"
          done
          az keyvault secret list --vault-name kv-sec-prototype-shared --query '[].name' -o tsv 2>&1 || true
          az k8s-configuration flux show -g "$RESOURCE_GROUP" -c "$CLUSTER" -t managedClusters -n example -o json
          kubectl logs -n flux-system deploy/source-controller --tail=60 | grep -i example || true
          kubectl wait --for=condition=Ready kustomizations.kustomize.toolkit.fluxcd.io --all -n flux-system --timeout=10m
          kubectl wait --for=condition=Ready helmreleases.helm.toolkit.fluxcd.io --all -n flux-system --timeout=10m
          kubectl wait --for=condition=Ready kustomizations.kustomize.toolkit.fluxcd.io example-apps -n example --timeout=10m
          kubectl wait --for=condition=Available deployment aks-hello -n example --timeout=5m
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io,helmreleases.helm.toolkit.fluxcd.io,gitrepositories.source.toolkit.fluxcd.io -A
          kubectl get pods -A -o wide
          kubectl get all,httproute,pvc -n example
          if kubectl get deployment,pvc -n example boot-log; then echo "::error::boot-log is deployed."; exit 1; fi
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 https://hello-b.onek8s.lol/healthz; then echo; break; fi
            sleep 30
          done
          curl -fsS --max-time 10 https://hello-b.onek8s.lol/ | head -c 500; echo
          if curl -fsS --max-time 10 https://hello-b.onek8s.lol/boot-log/log.txt; then echo "::error::boot-log answers."; exit 1; fi


  storageclasses:
    # Running in the previous verification run (deleted 20:26 UTC); not again.
    if: false
    runs-on: ubuntu-latest
    environment: prototype
    timeout-minutes: 180
    env:
      RESOURCE_GROUP: rg-aks-prototype
      CLUSTER: aks-prototype-b
      AAD_SERVICE_PRINCIPAL_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AAD_SERVICE_PRINCIPAL_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - name: Sign in to Azure
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          sudo az aks install-cli --only-show-errors >/dev/null

      # The cluster may still be (re)building: wait for its credentials and the platform's
      # no-persistent-storage policy, which Flux applies.
      - name: Wait for the cluster and its policy
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          for i in $(seq 1 75); do
            echo "== $(date -u +%T)"
            if az aks get-credentials -g "$RESOURCE_GROUP" -n "$CLUSTER" --file "$KUBECONFIG" --overwrite-existing --only-show-errors \
              && kubelogin convert-kubeconfig -l spn --client-id "$AAD_SERVICE_PRINCIPAL_CLIENT_ID" --client-secret "$AAD_SERVICE_PRINCIPAL_CLIENT_SECRET" --tenant-id "$AZURE_TENANT_ID" --server-id 6dae42f8-4368-4678-94ff-3960e28e3630 \
              && kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A \
              && kubectl get validatingadmissionpolicy no-persistent-storage; then
              exit 0
            fi
            sleep 60
          done
          echo "::error::The cluster or its no-persistent-storage policy did not come up within 75 minutes."
          exit 1

      - name: Delete AKS's StorageClasses
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          set -x
          kubectl get storageclass
          kubectl delete storageclass default managed-csi-premium-v2 --ignore-not-found
          date -u +%s > "$RUNNER_TEMP/deleted-at"
          sleep 120
          kubectl get storageclass
          test -z "$(kubectl get storageclass -o name)"

      - name: An hour later, still no StorageClass
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          wait=$(( $(cat "$RUNNER_TEMP/deleted-at") + 3600 - $(date +%s) ))
          [ "$wait" -gt 0 ] && sleep "$wait"
          set -x
          kubectl get storageclass
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A
          curl -fsS --max-time 10 https://hello-b.onek8s.lol/healthz; echo
          if [ -n "$(kubectl get storageclass -o name)" ]; then
            echo "::error::StorageClasses came back."
            exit 1
          fi

name: Deploy prototype-a (temporary)

# Temporary: applies prototype-shared and then prototype-a from a pull request, to bring the
# environment up after the shared/ refactoring. Remove before merging.
on:
  pull_request:

permissions:
  contents: read

jobs:
  shared:
    uses: ./.github/workflows/deploy-prototype.yml
    with:
      stack: prototype-shared
      action: apply
      allow_empty_state: true
    secrets: inherit

  prototype-a:
    needs: shared
    uses: ./.github/workflows/deploy-prototype.yml
    with:
      stack: prototype-a
      action: apply
      allow_empty_state: true
    secrets: inherit

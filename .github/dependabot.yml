version: 2

updates:
  # The AVM module and the provider versions in .terraform.lock.hcl. Pinned versions are only worth
  # pinning if something tells you when they go stale.
  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "terraform"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

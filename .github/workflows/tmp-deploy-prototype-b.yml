name: Deploy prototype (temporary)

# Temporary: applies prototype-shared and then both clusters from a pull request - the shared
# container registry, and each cluster's identities on it. Remove before merging.
on:
  pull_request:
    paths:
      - "**.tf"
      - "envs/**"
      - "shared/**"
      - "modules/**"
      - .github/workflows/deploy-prototype.yml

permissions:
  contents: read

jobs:
  shared:
    uses: ./.github/workflows/deploy-prototype.yml
    with:
      stack: prototype-shared
      action: apply
    secrets: inherit

  prototype-a:
    needs: shared
    uses: ./.github/workflows/deploy-prototype.yml
    with:
      stack: prototype-a
      action: apply
    secrets: inherit

  prototype-b:
    needs: shared
    uses: ./.github/workflows/deploy-prototype.yml
    with:
      stack: prototype-b
      action: apply
      allow_empty_state: true
    secrets: inherit

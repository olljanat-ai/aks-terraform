name: Deploy prototype-b (temporary)

# Temporary: applies prototype-shared and then prototype-b from a pull request, to bring the
# stateless aks-prototype-b up. Remove before merging.
on:
  pull_request:

permissions:
  contents: read

jobs:
  shared:
    uses: ./.github/workflows/deploy-prototype.yml
    with:
      stack: prototype-shared
      action: apply
    secrets: inherit

  prototype-b:
    needs: shared
    uses: ./.github/workflows/deploy-prototype.yml
    with:
      stack: prototype-b
      action: apply
      allow_empty_state: true
    secrets: inherit

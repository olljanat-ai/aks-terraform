name: Verify prototype (temporary)

# Temporary: on both clusters, waits for the example tenant's Git source from the shared container
# registry, then checks that Flux is in sync, aks-hello runs and answers on the cluster's hostname -
# and, on the stateless aks-prototype-b, that boot-log is not there. Remove before merging.
on:
  pull_request:
    paths:
      - .github/workflows/tmp-verify-prototype-b.yml

permissions:
  contents: read

concurrency:
  group: tmp-verify-prototype-3
  cancel-in-progress: true

jobs:
  verify:
    name: verify ${{ matrix.cluster }}
    runs-on: ubuntu-latest
    environment: prototype
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - cluster: aks-prototype-a
            hostname: hello.onek8s.lol
          - cluster: aks-prototype-b
            hostname: hello-b.onek8s.lol
    env:
      RESOURCE_GROUP: rg-aks-prototype
      CLUSTER: ${{ matrix.cluster }}
      HOSTNAME_: ${{ matrix.hostname }}
      AAD_SERVICE_PRINCIPAL_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AAD_SERVICE_PRINCIPAL_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - name: Sign in to Azure
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          sudo az aks install-cli --only-show-errors >/dev/null

      # The clusters are being applied in the other workflow: wait until the example tenant's Flux
      # configuration reads its Git repository again.
      - name: Wait for the tenant's Git source
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          for i in $(seq 1 75); do
            echo "== $(date -u +%T)"
            if az aks get-credentials -g "$RESOURCE_GROUP" -n "$CLUSTER" --file "$KUBECONFIG" --overwrite-existing --only-show-errors \
              && kubelogin convert-kubeconfig -l spn --client-id "$AAD_SERVICE_PRINCIPAL_CLIENT_ID" --client-secret "$AAD_SERVICE_PRINCIPAL_CLIENT_SECRET" --tenant-id "$AZURE_TENANT_ID" --server-id 6dae42f8-4368-4678-94ff-3960e28e3630 \
              && kubectl get gitrepositories.source.toolkit.fluxcd.io -n example example; then
              exit 0
            fi
            sleep 60
          done
          echo "::error::The example tenant's Git source did not appear within 75 minutes."
          exit 1

      - name: Flux in sync, aks-hello up
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          set -x
          kubectl get externalsecrets.external-secrets.io -n example
          kubectl wait --for=condition=Ready gitrepositories.source.toolkit.fluxcd.io example -n example --timeout=5m || {
            kubectl get gitrepositories.source.toolkit.fluxcd.io -n example example -o yaml
            kubectl logs -n flux-system deploy/source-controller --tail=40 | grep -i example || true
            exit 1
          }
          kubectl wait --for=condition=Ready kustomizations.kustomize.toolkit.fluxcd.io --all -n flux-system --timeout=5m
          kubectl wait --for=condition=Ready kustomizations.kustomize.toolkit.fluxcd.io example-apps -n example --timeout=5m || {
            kubectl get kustomizations.kustomize.toolkit.fluxcd.io -n example example-apps -o yaml | tail -n 30
            kubectl get pods,events -n example
            exit 1
          }
          kubectl wait --for=condition=Available deployment aks-hello -n example --timeout=5m
          kubectl get gitrepositories.source.toolkit.fluxcd.io,kustomizations.kustomize.toolkit.fluxcd.io,helmreleases.helm.toolkit.fluxcd.io -A
          kubectl get all,httproute,pvc -n example
          kubectl get pods -n example -o jsonpath='{range .items[*]}{.metadata.name}: {.spec.containers[*].image}{"\n"}{end}'
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "https://${HOSTNAME_}/healthz"; then echo; break; fi
            sleep 30
          done
          curl -fsS --max-time 10 "https://${HOSTNAME_}/" | head -c 600; echo

      - name: No boot-log on the stateless cluster
        if: matrix.cluster == 'aks-prototype-b'
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          set -x
          kubectl get storageclass
          if kubectl get deployment,pvc -n example boot-log; then echo "::error::boot-log is deployed."; exit 1; fi
          if curl -fsS --max-time 10 "https://${HOSTNAME_}/boot-log/log.txt"; then echo "::error::boot-log answers."; exit 1; fi
